<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My WhatsApp Clone</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body class="bg-gray-100 h-screen flex flex-col justify-between font-sans">

    <div class="bg-teal-600 text-white p-4 shadow-md flex justify-between items-center">
        <h1 class="text-xl font-bold">💬 Our Private Chat</h1>
        <span id="user-display" class="text-sm bg-teal-700 px-3 py-1 rounded"></span>
    </div>

    <div id="chat-box" class="flex-1 p-4 overflow-y-auto space-y-4 bg-amber-50" style="background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');">
        </div>

    <form id="chat-form" class="bg-gray-200 p-4 flex items-center gap-2 shadow-inner">
        <label class="bg-gray-300 hover:bg-gray-400 p-2 rounded-full cursor-pointer transition">
            📁
            <input type="file" id="image-input" accept="image/*" class="hidden">
        </label>
        
        <input type="text" id="message-input" placeholder="Type a message..." class="flex-1 p-2 rounded-lg border border-gray-300 focus:outline-none focus:border-teal-500" required>
        
        <button type="submit" class="bg-teal-600 hover:bg-teal-700 text-white px-6 py-2 rounded-lg font-semibold transition">
            Send
        </button>
    </form>

    <script>
        // 1. Firebase Configuration (Temporary Public Database for testing)
        const firebaseConfig = {
            databaseURL: "https://whatsapp-clone-demo-default-rtdb.firebaseio.com/"
        };
        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // 2. Ask for Username
        let username = prompt("Apna naam likhein (Enter your name):");
        if (!username) username = "Anonymous User";
        document.getElementById('user-display').innerText = "Logged in as: " + username;

        const chatBox = document.getElementById('chat-box');
        const chatForm = document.getElementById('chat-form');
        const messageInput = document.getElementById('message-input');
        const imageInput = document.getElementById('image-input');

        // 3. Handle Sending Message & Images
        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = messageInput.value.trim();
            const file = imageInput.files[0];

            if (file) {
                // Convert image to Base64 string to store in Database
                const reader = new FileReader();
                reader.onload = function(event) {
                    database.ref('messages').push({
                        sender: username,
                        text: text || "Sent a photo",
                        image: event.target.result,
                        timestamp: Date.now()
                    });
                };
                reader.readAsDataURL(file);
                imageInput.value = ""; // clear file input
            } else if (text) {
                // Send only text
                database.ref('messages').push({
                    sender: username,
                    text: text,
                    image: null,
                    timestamp: Date.now()
                });
            }

            messageInput.value = ""; // clear text input
        });

        // 4. Listen for Real-time Messages from Firebase
        database.ref('messages').limitToLast(50).on('child_added', (snapshot) => {
            const data = snapshot.val();
            displayMessage(data);
        });

        // 5. Display Message function
        function displayMessage(data) {
            const isMe = data.sender === username;
            const messageDiv = document.createElement('div');
            
            // Layout styling based on who sent the message
            messageDiv.className = `flex ${isMe ? 'justify-end' : 'justify-start'} w-full`;

            let imageHtml = data.image ? `<img src="${data.image}" class="rounded-lg max-w-xs my-2 shadow" />` : '';

            messageDiv.innerHTML = `
                <div class="${isMe ? 'bg-teal-100 text-gray-800' : 'bg-white text-gray-800'} p-3 rounded-xl max-w-md shadow-md relative">
                    <span class="block text-xs font-bold text-teal-700 mb-1">${data.sender}</span>
                    ${imageHtml}
                    <p class="text-sm break-words">${data.text}</p>
                </div>
            `;

            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight; // Auto scroll to bottom
        }
    </script>
</body>
</html>
