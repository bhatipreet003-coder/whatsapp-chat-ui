<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Clone - MultiUser</title>
    <!-- Tailwind CSS for modern look -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Firebase core and realtime database -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        /* WhatsApp default background chat wallpaper */
        .chat-bg {
            background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');
            background-repeat: repeat;
        }
    </style>
</head>
<body class="bg-gray-900 h-screen flex items-center justify-center font-sans antialiased">

    <!-- 1. LOGIN SCREEN -->
    <div id="login-screen" class="bg-gray-800 p-8 rounded-2xl shadow-2xl w-full max-w-md text-white border border-gray-700">
        <div class="text-center mb-6">
            <span class="text-5xl">💬</span>
            <h2 class="text-2xl font-bold mt-2 text-emerald-400">Our Private WhatsApp</h2>
            <p class="text-gray-400 text-sm mt-1">Enter Email & Choose a Room Password</p>
        </div>
        <div class="space-y-4">
            <div>
                <label class="block text-xs uppercase font-bold text-gray-400 mb-1">Email Address</label>
                <input type="email" id="login-email" placeholder="naam@gmail.com" class="w-full p-3 bg-gray-700 border border-gray-600 rounded-lg text-white focus:outline-none focus:border-emerald-500">
            </div>
            <div>
                <label class="block text-xs uppercase font-bold text-gray-400 mb-1">Room Password (Sabka Same Hona Chahiye)</label>
                <input type="password" id="login-pass" placeholder="Enter Secret Pass" class="w-full p-3 bg-gray-700 border border-gray-600 rounded-lg text-white focus:outline-none focus:border-emerald-500">
            </div>
            <button id="btn-login" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold p-3 rounded-lg transition duration-200 shadow-lg">
                Log In / Join Room
            </button>
        </div>
    </div>

    <!-- 2. MAIN CHAT INTERFACE (Hidden by default) -->
    <div id="chat-interface" class="hidden w-full h-full max-w-6xl md:h-[90vh] bg-gray-800 md:rounded-2xl shadow-2xl overflow-hidden flex flex-col md:flex-row border border-gray-700">
        
        <!-- Sidebar: Info & Theme Customization -->
        <div class="w-full md:w-80 bg-gray-850 border-b md:border-b-0 md:border-r border-gray-700 flex flex-col text-white">
            <!-- Sidebar Header -->
            <div class="p-4 bg-gray-900 flex justify-between items-center border-b border-gray-700">
                <div class="flex items-center gap-2">
                    <div class="w-3 h-3 bg-emerald-500 rounded-full animate-pulse"></div>
                    <span class="font-semibold text-emerald-400 text-sm" id="display-user">User</span>
                </div>
                <button id="btn-logout" class="text-xs bg-red-600 hover:bg-red-700 px-2 py-1 rounded">Logout</button>
            </div>
            
            <!-- Customizer Section -->
            <div class="p-4 flex-1 space-y-4">
                <h3 class="font-bold text-gray-300 text-xs uppercase tracking-wider">🎨 Theme Customizer</h3>
                
                <!-- Header Color -->
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Header Theme Color</label>
                    <select id="theme-header" class="w-full p-2 bg-gray-700 border border-gray-600 rounded text-sm focus:outline-none">
                        <option value="bg-emerald-700">WhatsApp Green</option>
                        <option value="bg-blue-700">Classic Blue</option>
                        <option value="bg-purple-700">Royal Purple</option>
                        <option value="bg-red-700">Crimson Red</option>
                        <option value="bg-gray-800">Stealth Dark</option>
                    </select>
                </div>

                <!-- Chat Background Tint -->
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Chat Wallpaper Tint</label>
                    <select id="theme-bg" class="w-full p-2 bg-gray-700 border border-gray-600 rounded text-sm focus:outline-none">
                        <option value="bg-amber-50">Classic Light Amber</option>
                        <option value="bg-gray-900 text-white">Ultradark Night</option>
                        <option value="bg-sky-100">Soft Blue Ice</option>
                        <option value="bg-rose-50">Blush Pink</option>
                    </select>
                </div>
                <p class="text-xs text-gray-500 italic">Note: Yeh theme abhi aapki screen par live change hogi!</p>
            </div>
        </div>

        <!-- Main Chat Window -->
        <div class="flex-1 flex flex-col justify-between h-full bg-gray-950">
            <!-- Chat Top Header -->
            <div id="chat-header" class="bg-emerald-700 text-white p-4 shadow-md flex items-center gap-3 transition-colors duration-200">
                <div class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center text-xl font-bold">👥</div>
                <div>
                    <h1 class="font-bold text-base">Core Friends Circle</h1>
                    <p class="text-xs text-white/80">4-5 members active</p>
                </div>
            </div>

            <!-- Chat Messages Window -->
            <div id="chat-box" class="flex-1 p-4 overflow-y-auto space-y-3 chat-bg bg-amber-50 transition-colors duration-200">
                <!-- Messages populate here -->
            </div>

            <!-- Input Bar -->
            <form id="chat-form" class="bg-gray-900 p-4 flex items-center gap-3 border-t border-gray-800">
                <!-- Image Attachment Icon -->
                <label class="bg-gray-800 hover:bg-gray-700 text-gray-300 p-3 rounded-full cursor-pointer transition shrink-0 flex items-center justify-center w-11 h-11 border border-gray-700">
                    📷
                    <input type="file" id="image-input" accept="image/*" class="hidden">
                </label>
                
                <!-- Text Field -->
                <input type="text" id="message-input" placeholder="Type a message..." class="flex-1 p-3 bg-gray-800 text-white rounded-xl border border-gray-700 focus:outline-none focus:border-emerald-500 text-sm" required autocomplete="off">
                
                <!-- Send Button -->
                <button type="submit" id="btn-send" class="bg-emerald-600 hover:bg-emerald-500 text-white px-5 h-11 rounded-xl font-semibold transition shrink-0 shadow-md">
                    Send
                </button>
            </form>
        </div>

    </div>

    <script>
        // 1. Firebase Live Demo Database Configuration
        const firebaseConfig = {
            databaseURL: "https://whatsapp-clone-demo-default-rtdb.firebaseio.com/"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // Application StateVariables
        let currentUserEmail = "";
        let currentRoom = "";

        // UI Selectors
        const loginScreen = document.getElementById('login-screen');
        const chatInterface = document.getElementById('chat-interface');
        const loginEmail = document.getElementById('login-email');
        const loginPass = document.getElementById('login-pass');
        const btnLogin = document.getElementById('btn-login');
        const displayUser = document.getElementById('display-user');
        const btnLogout = document.getElementById('btn-logout');
        
        const chatBox = document.getElementById('chat-box');
        const chatForm = document.getElementById('chat-form');
        const messageInput = document.getElementById('message-input');
        const imageInput = document.getElementById('image-input');
        
        // Theme Elements
        const chatHeader = document.getElementById('chat-header');
        const themeHeaderSelect = document.getElementById('theme-header');
        const themeBgSelect = document.getElementById('theme-bg');

        // 2. Handle Login Execution (No Google dependency, direct routing)
        btnLogin.addEventListener('click', () => {
            const email = loginEmail.value.trim();
            const pass = loginPass.value.trim();

            if(!email || !pass) {
                alert("Bhai, Email aur Password dono bharna zaroori hai!");
                return;
            }

            currentUserEmail = email;
            // Sanitize room key for Firebase database pathing
            currentRoom = btoa(pass).replace(/=/g, ""); 

            // Switch Screen UI
            loginScreen.classList.add('hidden');
            chatInterface.classList.remove('hidden');
            displayUser.innerText = email.split('@')[0]; // Show username before @

            // Start Listening to specific password protected chat room
            initChatRoom(currentRoom);
        });

        // 3. Main Chat Stream Engine
        function initChatRoom(roomID) {
            chatBox.innerHTML = ""; // Clear legacy screen
            
            // Unbind previous refs if any, then track active room nodes
            database.ref('rooms/' + roomID).limitToLast(100).on('child_added', (snapshot) => {
                const data = snapshot.val();
                renderNode(data);
            });
        }

        // 4. Send Messaging Processing (Text + Base64 Compressed Photos)
        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = messageInput.value.trim();
            const file = imageInput.files[0];
            const senderName = currentUserEmail.split('@')[0];

            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    database.ref('rooms/' + currentRoom).push({
                        sender: senderName,
                        email: currentUserEmail,
                        text: text || "📷 Photo",
                        image: event.target.result,
                        time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
                    });
                };
                reader.readAsDataURL(file);
                imageInput.value = ""; // Flush field
            } else if (text) {
                database.ref('rooms/' + currentRoom).push({
                    sender: senderName,
                    email: currentUserEmail,
                    text: text,
                    image: null,
                    time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
                });
            }
            messageInput.value = ""; // Reset focus input
        });

        // 5. Render Bubble Layout UI (Align Right for me, Left for friends)
        function renderNode(data) {
            const isMe = data.email === currentUserEmail;
            const row = document.createElement('div');
            row.className = `flex ${isMe ? 'justify-end' : 'justify-start'} w-full`;

            let imgPayload = data.image ? `<img src="${data.image}" class="rounded-lg max-w-xs max-h-60 object-cover my-1 shadow-sm cursor-pointer" onclick="window.open(this.src)" />` : '';

            row.innerHTML = `
                <div class="${isMe ? 'bg-emerald-200 text-gray-900 rounded-l-xl rounded-br-xl' : 'bg-white text-gray-900 rounded-r-xl rounded-bl-xl'} p-2.5 px-4 max-w-xs md:max-w-md shadow position-relative border border-black/5">
                    ${!isMe ? `<span class="block text-[11px] font-bold text-emerald-700 tracking-wide mb-0.5">${data.sender}</span>` : ''}
                    ${imgPayload}
                    <p class="text-sm break-words leading-relaxed">${data.text}</p>
                    <span class="block text-[9px] text-gray-500 text-right mt-1">${data.time}</span>
                </div>
            `;
            chatBox.appendChild(row);
            chatBox.scrollTop = chatBox.scrollHeight; // Auto-scroll downward
        }

        // 6. Dynamic Realtime UI Theme Customizer
        themeHeaderSelect.addEventListener('change', (e) => {
            chatHeader.className = `${e.target.value} text-white p-4 shadow-md flex items-center gap-3 transition-colors duration-200`;
        });

        themeBgSelect.addEventListener('change', (e) => {
            const currentSelected = e.target.value;
            chatBox.className = `flex-1 p-4 overflow-y-auto space-y-3 chat-bg ${currentSelected} transition-colors duration-200`;
        });

        // Logout routing fallback
        btnLogout.addEventListener('click', () => {
            location.reload();
        });
    </script>
</body>
</html>
