<!DOCTYPE html>
<html>
<head>
<title>WhatsApp Style</title>
<style>
body{
margin:0;
background:#ece5dd;
font-family:Arial;
}
.header{
background:#075E54;
color:white;
padding:15px;
font-size:22px;
font-weight:bold;
}
.chat{
padding:15px;
}
.left,.right{
padding:10px 15px;
border-radius:10px;
margin:10px;
display:inline-block;
max-width:70%;
}
.left{
background:white;
}
.right{
background:#DCF8C6;
float:right;
clear:both;
}
.input{
position:fixed;
bottom:0;
width:100%;
display:flex;
background:white;
padding:10px;
}
input{
flex:1;
padding:10px;
border-radius:20px;
border:1px solid gray;
}
button{
background:#075E54;
color:white;
border:none;
padding:10px 20px;
border-radius:20px;
margin-left:5px;
}
</style>
</head>

<body>

<div class="header">
WhatsApp Clone
</div>

<div class="chat" id="chat">
<div class="left">Hello 👋</div><br>
<div class="right">Hi 😊</div><br>
<div class="left">Kaise ho?</div>
</div>

<div class="input">
<input type="text" id="msg" placeholder="Type message...">
<button onclick="send()">Send</button>
</div>

<script>
function send(){
var x=document.getElementById("msg").value;
if(x!=""){
document.getElementById("chat").innerHTML+=
"<br><div class='right'>"+x+"</div><br>";
document.getElementById("msg").value="";
}
}
</script>

</body>
</html>
