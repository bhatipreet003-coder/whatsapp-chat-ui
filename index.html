<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Private Group Chat</title>
<style>
body{margin:0;font-family:Arial;background:#ece5dd}
.header{background:#075e54;color:white;padding:14px;font-size:20px;font-weight:bold;display:flex;justify-content:space-between;align-items:center}
.top{padding:10px;background:white;display:flex;gap:6px}
.chat{height:68vh;overflow:auto;padding:12px}
.msg{padding:10px 14px;border-radius:10px;margin:8px;max-width:75%;clear:both}
.left{background:white;float:left}
.right{background:#dcf8c6;float:right}
.name{font-size:11px;color:#555;margin-bottom:4px}
.msg img{max-width:240px;border-radius:10px;margin-top:6px;display:block}
.input{position:fixed;bottom:0;width:100%;display:flex;background:white;padding:10px;box-sizing:border-box;gap:6px}
input{flex:1;padding:12px;border-radius:20px;border:1px solid gray}
button{background:#075e54;color:white;border:none;padding:10px 15px;border-radius:20px;cursor:pointer}
.photo{background:#128c7e;font-size:18px}
</style>
</head>
<body>

<div class="header">
  <div>Private Group Chat</div>
  <button id="loginBtn">Login</button>
</div>

<div class="top">
  <input id="room" placeholder="Room code: preet123">
  <button id="joinBtn">Join</button>
</div>

<div id="chat" class="chat"></div>

<div class="input">
  <input type="file" id="photoInput" accept="image/*" style="display:none">
  <button class="photo" id="photoBtn">📷</button>
  <input id="msg" placeholder="Type message...">
  <button id="sendBtn">Send</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";
import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCuy8Zu-lwJmqDV4WBz_QI-WfN_71dFi8Q",
  authDomain: "whatsapp-chat-ui.firebaseapp.com",
  projectId: "whatsapp-chat-ui",
  storageBucket: "whatsapp-chat-ui.firebasestorage.app",
  messagingSenderId: "997794339112",
  appId: "1:997794339112:web:c66d6ccc3d117b97f4d81d",
  measurementId: "G-BVY9MW4W77"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;
let currentRoom = localStorage.getItem("roomCode") || "";
let unsubscribe = null;

const loginBtn = document.getElementById("loginBtn");
const joinBtn = document.getElementById("joinBtn");
const roomInput = document.getElementById("room");
const msgInput = document.getElementById("msg");
const sendBtn = document.getElementById("sendBtn");
const chat = document.getElementById("chat");
const photoBtn = document.getElementById("photoBtn");
const photoInput = document.getElementById("photoInput");

roomInput.value = currentRoom;

loginBtn.onclick = async () => {
  if(currentUser){ await signOut(auth); }
  else{ await signInWithPopup(auth,new GoogleAuthProvider()); }
};

onAuthStateChanged(auth,user => {
  currentUser = user;
  loginBtn.innerText = user ? "Logout" : "Login";
  if(currentRoom && currentUser) loadMessages();
});

joinBtn.onclick = async () => {
  if(!currentUser){ alert("Pehle Login karo"); return; }

  currentRoom = roomInput.value.trim();
  if(!currentRoom){ alert("Room code likho"); return; }

  const roomRef = doc(db,"rooms",currentRoom);
  const snap = await getDoc(roomRef);

  let members = [];
  if(snap.exists()) members = snap.data().members || [];

  if(!members.includes(currentUser.uid)){
    if(members.length >= 3){
      alert("Is room me already 3 members hain");
      return;
    }
    members.push(currentUser.uid);
    await setDoc(roomRef,{members:members},{merge:true});
  }

  localStorage.setItem("roomCode",currentRoom);
  loadMessages();
  alert("Room joined: "+currentRoom);
};

async function sendMsg(){
  const text = msgInput.value.trim();

  if(!currentUser){ alert("Pehle Login karo"); return; }
  if(!currentRoom){ alert("Pehle Room join karo"); return; }

  if(text){
    await addDoc(collection(db,"rooms",currentRoom,"messages"),{
      type:"text",
      text:text,
      uid:currentUser.uid,
      name:currentUser.displayName,
      createdAt:serverTimestamp()
    });
    msgInput.value="";
  }
}

sendBtn.onclick = sendMsg;
msgInput.addEventListener("keydown",e => { if(e.key==="Enter") sendMsg(); });

photoBtn.onclick = () => {
  if(!currentUser){ alert("Pehle Login karo"); return; }
  if(!currentRoom){ alert("Pehle Room join karo"); return; }
  photoInput.click();
};

photoInput.onchange = async e => {
  const file = e.target.files[0];
  if(!file) return;

  const imageData = await compressImage(file);

  await addDoc(collection(db,"rooms",currentRoom,"messages"),{
    type:"image",
    image:imageData,
    uid:currentUser.uid,
    name:currentUser.displayName,
    createdAt:serverTimestamp()
  });

  photoInput.value="";
};

function compressImage(file){
  return new Promise(resolve => {
    const reader = new FileReader();

    reader.onload = ev => {
      const img = new Image();

      img.onload = () => {
        const canvas = document.createElement("canvas");
        const maxSize = 600;

        let width = img.width;
        let height = img.height;

        if(width > height){
          if(width > maxSize){
            height = height * maxSize / width;
            width = maxSize;
          }
        }else{
          if(height > maxSize){
            width = width * maxSize / height;
            height = maxSize;
          }
        }

        canvas.width = width;
        canvas.height = height;

        const ctx = canvas.getContext("2d");
        ctx.drawImage(img,0,0,width,height);

        resolve(canvas.toDataURL("image/jpeg",0.45));
      };

      img.src = ev.target.result;
    };

    reader.readAsDataURL(file);
  });
}

function loadMessages(){
  if(unsubscribe) unsubscribe();

  const q = query(collection(db,"rooms",currentRoom,"messages"),orderBy("createdAt"));

  unsubscribe = onSnapshot(q,snapshot => {
    chat.innerHTML = "";

    snapshot.forEach(d => {
      const data = d.data();

      const div = document.createElement("div");
      div.className = "msg " + (currentUser && data.uid === currentUser.uid ? "right" : "left");

      const name = document.createElement("div");
      name.className = "name";
      name.innerText = data.name || "User";
      div.appendChild(name);

      if(data.type === "image"){
        const img = document.createElement("img");
        img.src = data.image;
        div.appendChild(img);
      }else{
        const text = document.createElement("div");
        text.innerText = data.text || "";
        div.appendChild(text);
      }

      chat.appendChild(div);
    });

    chat.scrollTop = chat.scrollHeight;
  });
}
</script>

</body>
</html>
